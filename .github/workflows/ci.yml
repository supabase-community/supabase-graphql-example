name: ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: the-guild-org/shared-config/setup@main
        with:
          nodeVersion: 16
      - run: yarn codegen
      - run: yarn workspace app run build
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: the-guild-org/shared-config/setup@main
        with:
          nodeVersion: 16
      - run: yarn workspace app run lint
